name: MinBtc

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  MinBtc:
    type: application
    platform: iOS

    sources:
      - MinBtcApp.swift
      - ContentView.swift
      - MiningEngine.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.minbtc
        PRODUCT_NAME: MinBTC
        INFOPLIST_KEY_CFBundleDisplayName: MinBTC
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
